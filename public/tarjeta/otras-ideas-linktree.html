/* ============================================================
   2) MARCO DE TELÉFONO — acabado "titanio" con textura cepillada,
   botones físicos y sombra de suelo para que asiente como un objeto real
   ============================================================ */
.stage{
  position:relative;
  padding-top: 30px; /* deja sitio a la sombra de suelo sin recortarla */
}

/* sombra proyectada en el "suelo": una capa de contacto ceñida
   y otra ambiental más ancha y difusa, para dar sensación de volumen */
.stage::after{
  content:"";
  position:absolute;
  left:50%; bottom:-30px; transform:translateX(-50%);
  width:82%; height:40px;
  background:
    radial-gradient(45% 100% at 50% 0%, rgba(0,0,0,0.5), transparent 65%),
    radial-gradient(60% 100% at 50% 30%, rgba(0,0,0,0.28), transparent 75%);
  filter: blur(9px);
  z-index:-1;
}
.stage::before{
  content:"";
  position:absolute;
  left:50%; bottom:-14px; transform:translateX(-50%);
  width:60%; height:10px;
  background: radial-gradient(50% 100% at 50% 50%, rgba(0,0,0,0.55), transparent 70%);
  filter: blur(3px);
  z-index:-1;
}

.phone{
  position:relative;
  width: 375px;
  max-width: 100%;
  max-height: 88vh;
  max-height: 88dvh;
  aspect-ratio: 375 / 812;
  border-radius: var(--phone-radius);
  padding: 5px;
  background:
    radial-gradient(120px 120px at 8% 4%, rgba(255,255,255,0.55), transparent 60%),
    radial-gradient(140px 140px at 96% 100%, rgba(255,255,255,0.16), transparent 55%),
    linear-gradient(150deg, rgba(255,255,255,0.30), transparent 18%),
    linear-gradient(20deg, rgba(255,255,255,0.10), transparent 14%),
    repeating-linear-gradient(95deg, #35363a 0px, #313235 2px, #26272a 3px, #2c2d30 5px),
    linear-gradient(165deg, #3a3b3e, #1a1b1d 45%, #0c0d0e);
  background-blend-mode: screen, screen, screen, screen, normal, normal;
  box-shadow:
    0 50px 90px -20px rgba(0,0,0,0.65),
    0 10px 30px rgba(0,0,0,0.45),
    0 0 0 1px rgba(0,0,0,0.6),
    0 0 0 2.5px rgba(120,122,128,0.5) inset;
}

/* botones físicos: sobresalen ligeramente del marco */
.btn{
  position:absolute;
  background: linear-gradient(90deg, #1a1b1d, #3a3b3e 40%, #1a1b1d);
  box-shadow: 0 1px 1px rgba(255,255,255,0.15) inset, 0 1px 2px rgba(0,0,0,0.6);
  z-index:1;
}
.btn.left{ left:-3px; width:3px; border-radius:2px 0 0 2px; }
.btn.right{ right:-3px; width:3px; border-radius:0 2px 2px 0; }
.btn.action{ top:108px; height:26px; }
.btn.vol-up{ top:150px; height:46px; }
.btn.vol-down{ top:204px; height:46px; }
.btn.power{ top:150px; height:64px; }

.screen{
  position:relative;
  width:100%; height:100%;
  border-radius: calc(var(--phone-radius) - 3px);
  overflow:hidden;
  background: linear-gradient(180deg, var(--bg-a), var(--bg-b));
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.85),
    0 1px 3px rgba(0,0,0,0.6) inset;
  display:flex;
  flex-direction:column;
}

/* fondo limpio y neutro (sustitúyelo por tu propia imagen cuando la tengas:
   cambia el background de .screen por background:url('tu-imagen.jpg') center/cover;) */
.screen::before{
  content:"";
  position:absolute; inset:0;
  background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,0.28) 100%);
  pointer-events:none;
}

/* reflejo de cristal: un barrido diagonal sutil más una luz suave arriba,
   como si una fuente de luz incidiera sobre el cristal */
.screen::after{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(60% 30% at 22% 0%, rgba(255,255,255,0.16), transparent 60%),
    linear-gradient(115deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 12%, transparent 26%, transparent 76%, rgba(255,255,255,0.04) 92%, rgba(255,255,255,0.10) 100%);
  pointer-events:none;
  z-index: 6;
}

.dynamic-island{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:100px; height:28px; border-radius:20px;
  background:#000;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset;
  z-index:5;
}
/* lente de la cámara dentro de la isla dinámica */
.dynamic-island::after{
  content:"";
  position:absolute; top:50%; right:12px; transform:translateY(-50%);
  width:9px; height:9px; border-radius:50%;
  background: radial-gradient(circle at 35% 35%, #4a5a6a, #05070a 70%);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
}

/* barra inferior estilo "home indicator" del iPhone — fija, fuera del
   scroll del contenido, como en un iPhone real */
.home-indicator{
  position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  width:120px; height:5px; border-radius:3px;
  background: rgba(244,241,234,0.55);
  z-index:7;
  pointer-events:none;
}

/* barra de estado */
.statusbar{
  position:relative; z-index:2;
  display:flex; align-items:center; justify-content:space-between;
  padding: 16px 26px 0;
  font-size:15px; font-weight:600; letter-spacing:0.2px;
  font-variant-numeric: tabular-nums;
}
.statusbar .icons{ display:flex; gap:5px; align-items:center; }
.statusbar{ flex-shrink:0; }

.content{
  position:relative; z-index:2;
  flex:1 1 auto;
  min-height:0;
  display:flex; flex-direction:column;
  padding: 6px 18px 18px;
  overflow-y:auto;
}

/* reloj estilo pantalla de bloqueo */
.clock{ text-align:center; margin: 6px 0 14px; }
.clock .time{ font-size:56px; font-weight:600; line-height:1; letter-spacing:-1px; }
.clock .date{ font-size:14px; color:var(--ink-dim); margin-top:4px; text-transform:capitalize; }

/* fila superior: identidad (2x1) + dos tarjetas de contacto (1x1 cada una) */
.top-row{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 14px;
  align-items:center;
}

/* tarjeta / avatar de identidad — 2 columnas, pegada arriba a la izquierda */
.identity{
  grid-column: span 2;
  position:relative;
  display:flex; align-items:center; gap:10px;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
  border:1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  border-radius: var(--tile-radius);
  padding: 10px 12px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 18px rgba(0,0,0,0.22);
}
.identity .avatar{
  width:40px; height:40px; border-radius:12px;
  background: linear-gradient(160deg, #f0bb63, var(--accent) 60%);
  color: var(--accent-ink);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; flex-shrink:0;
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 3px 8px rgba(0,0,0,0.3);
}
.identity .who .name{ font-weight:600; font-size:13.5px; line-height:1.2; }
.identity .who .tag{ font-size:11px; color:var(--ink-dim); margin-top:1px; }

/* tarjetas de contacto personal — miniatura circular (como foto de perfil) + nombre debajo */
.contact-card{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  text-decoration:none; color:inherit;
}
.contact-card .thumb{
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:14px;
  border:1.5px solid rgba(255,255,255,0.35);
  box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 4px 10px rgba(0,0,0,0.35);
  transition: transform .15s ease;
}
.contact-card:active .thumb{ transform: scale(0.92); }
.contact-card:hover .thumb{ transform: translateY(-3px); }
.contact-card .label{
  font-size:10.5px; font-weight:600; color:var(--ink-dim);
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  transition: color .2s ease;
}
.contact-card:hover .label{ color: var(--ink); }

/* widget destacado (ej: valoración, oferta, CTA principal) */
.widget{
  display:block;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
  border:1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  border-radius: var(--tile-radius);
  padding: 16px;
  margin-top: 4px;
  margin-bottom: 4px;
  text-decoration:none;
  color:inherit;
  box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 18px rgba(0,0,0,0.22);
  transition: transform .15s ease;
}
.widget:active{ transform: scale(0.98); }
.widget .row{ display:flex; align-items:center; justify-content:space-between; }
.widget .label{ font-size:12.5px; color:var(--ink-dim); }
.widget .big{ font-size:26px; font-weight:700; margin-top:4px; }
.widget .stars{ color: var(--accent); font-size:15px; letter-spacing:2px; margin-top:6px; }
.widget .cta-pill{
  background: var(--accent); color:var(--accent-ink);
  font-size:12.5px; font-weight:700;
  padding:7px 12px; border-radius:999px; white-space:nowrap;
}

/* rejilla tipo "bento" — mezcla la foto grande (2x2) con iconos sueltos
   para que no todo tenga el mismo tamaño; así se ve menos uniforme */
.bento{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 56px;
  gap: 12px;
  margin-bottom: 16px;
}

/* foto grande, ocupa 2 columnas x 2 filas, pensada para tocar */
.photo-tile{
  grid-column: span 2;
  grid-row: span 2;
  position:relative;
  border-radius: var(--tile-radius);
  overflow:hidden;
  border:1px solid var(--glass-border);
  text-decoration:none;
  display:block;
}
.photo-tile img{
  width:100%; height:100%;
  object-fit: cover;
  display:block;
  transition: transform .2s ease;
}
.photo-tile:active img{ transform: scale(0.96); }
.photo-tile:hover img{ transform: scale(1.04); }
.photo-tile .caption{
  position:absolute; left:0; right:0; bottom:0;
  padding: 8px 10px;
  font-size:11.5px; font-weight:600; color:#fff;
  background: linear-gradient(0deg, rgba(0,0,0,0.55), transparent);
}
.photo-tile .caption small{ display:block; font-weight:500; opacity:.75; font-size:10px; margin-top:1px; }

/* elemento desactivado temporalmente — sin enlace todavía */
.disabled{
  pointer-events:none;
  opacity:0.5;
  filter: grayscale(0.4);
}
.disabled:hover, .disabled:active{ transform:none !important; }

/* hueco invisible dentro del bento, para desplazar el siguiente icono */
.spacer-cell{ pointer-events:none; }

/* línea en blanco — un hueco del alto de un icono, para separar bloques */
.row-gap{ height:56px; }

/* fila que solo contiene la tarjeta ancha, pegada a la derecha */
.loc-row{ display:flex; justify-content:flex-end; margin-bottom:16px; }
.loc-row .wide-tile{ width: calc(50% - 6px); }

/* tarjeta ancha (2 columnas x 1 fila) — para un dato tipo "ubicación",
   distinta a los iconos redondos, aporta variedad de formas al bento */
.wide-tile{
  grid-column: span 2;
  position:relative;
  display:flex; align-items:center; gap:10px;
  border-radius: var(--tile-radius);
  padding: 0 14px;
  background: linear-gradient(135deg, rgba(56,214,255,0.16), rgba(255,255,255,0.04));
  border:1px solid var(--glass-border);
  text-decoration:none; color:inherit;
  transition: transform .15s ease, background .15s ease;
}
.wide-tile:active{ transform: scale(0.98); }
.wide-tile:hover{ background: linear-gradient(135deg, rgba(56,214,255,0.26), rgba(255,255,255,0.06)); }
.wide-tile svg{ width:22px; height:22px; color:#38d6ff; filter: drop-shadow(0 0 6px rgba(56,214,255,0.7)); flex-shrink:0; }
.wide-tile .place{ font-size:12.5px; font-weight:600; line-height:1.2; }
.wide-tile .place small{ display:block; font-weight:500; color:var(--ink-dim); font-size:11px; margin-top:1px; }

/* los iconos sueltos ocupan 1 celda cada uno, dentro de la misma rejilla,
   así quedan repartidos alrededor de la foto en vez de en filas rígidas */
.app{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  text-decoration:none; color:inherit;
}
.app .icon{
  position:relative;
  overflow:hidden;
  width:56px; height:56px; border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)), rgba(10,13,18,0.55);
  border:1px solid var(--glass-border);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.14) inset,
    0 -6px 10px rgba(0,0,0,0.3) inset,
    0 4px 10px rgba(0,0,0,0.35);
  transition: transform .15s ease, box-shadow .2s ease;
}
.app .icon::before{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(160deg, rgba(255,255,255,0.14), transparent 45%);
  pointer-events:none;
}
.app:active .icon{ transform: scale(0.92); }
.app:hover .icon{
  transform: translateY(-3px);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.2) inset,
    0 -6px 10px rgba(0,0,0,0.3) inset,
    0 10px 18px rgba(0,0,0,0.4),
    0 0 22px -4px var(--neon, var(--accent));
}
.app svg{
  position:relative; z-index:1; width:24px; height:24px;
  color: var(--neon, var(--accent));
  filter: drop-shadow(0 0 2px currentColor) drop-shadow(0 0 7px currentColor);
  transition: filter .2s ease;
}
.app:hover svg{ filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 11px currentColor); }
.app .label{
  font-size:11px; font-weight:600; letter-spacing:0.15px;
  color: var(--ink-dim);
  text-align:center; max-width:70px; line-height:1.15;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  transition: color .2s ease;
}
.app:hover .label{ color: var(--ink); }

/* dock inferior — 4 accesos ÚNICOS, distintos a los de arriba, para no repetir enlaces */
.dock{
  margin-top: auto;
  margin-bottom: 2px;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  align-items:center;
  justify-items:center;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
  border:1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  border-radius: var(--tile-radius);
  padding: 12px 8px 10px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 10px 24px rgba(0,0,0,0.3);
}
.dock .app{ gap:5px; }
.dock .app .icon{ width:52px; height:52px; border-radius:15px; }
.dock .app svg{ width:24px; height:24px; }
.dock .app .label{ font-size:10.5px; max-width:56px; }

@media (max-width:420px){
  .phone{ width:100%; }
}
